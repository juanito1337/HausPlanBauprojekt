name: Offline repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the existing full G02 Python/simulation suite (no NX)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Integrity, Python syntax and repository tests
        run: python tools/run_checks.py
      - name: Existing full G02 suite
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: python tools/run_checks.py --full
